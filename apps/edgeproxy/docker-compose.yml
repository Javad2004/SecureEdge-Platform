services:
  origin:
    image: golang:1.23-alpine
    working_dir: /src
    volumes:
      - .:/src:ro
    command: ["go", "run", "./cmd/origin-demo", "-listen", ":9000", "-name", "origin-compose"]
    expose:
      - "9000"

  proxy:
    build: .
    depends_on:
      - origin
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./configs/compose.json:/app/config.json:ro
