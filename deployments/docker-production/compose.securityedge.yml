name: secureedge-securityedge-production

services:
  securityedge:
    image: "${SECURITYEDGE_IMAGE:-secureedge/securityedge:production}"
    build:
      context: ../..
      dockerfile: deployments/docker-production/Dockerfile.securityedge
      args:
        VERSION: "${SECUREEDGE_VERSION:-production}"
        COMMIT: "${SECUREEDGE_COMMIT:-unknown}"
        BUILD_TIME: "${SECUREEDGE_BUILD_TIME:-unknown}"
    network_mode: host
    user: "${SECURITYEDGE_UID:?set SECURITYEDGE_UID}:${SECURITYEDGE_GID:?set SECURITYEDGE_GID}"
    group_add:
      - "${EDGEPROXY_GID:?set EDGEPROXY_GID}"
    command:
      - -config
      - /app/config/securityedge.json
    environment:
      SSL_CERT_DIR: /etc/secureedge/ca:/etc/ssl/certs
      SECURITYEDGE_EDGEPROXY_CONFIG_PATH: /edgeproxy-config/config.json
      SECURITYEDGE_LOG_FILE_PATH: /app/logs/security-events.ndjson
      SECURITYEDGE_TELEMETRY_HISTORY_FILE: /app/config/telemetry-history.json
    secrets:
      - securityedge_admin_token
      - edgeproxy_admin_token
    volumes:
      - type: bind
        source: "${SECURITYEDGE_STATE_DIR:-/var/lib/securityedge}"
        target: /app/config
      - type: bind
        source: "${SECURITYEDGE_LOG_DIR:-/var/log/securityedge}"
        target: /app/logs
      - type: bind
        source: "${SECURITYEDGE_TLS_DIR:-/etc/securityedge/tls}"
        target: /etc/securityedge/tls
        read_only: true
      - type: bind
        source: "${SECUREEDGE_CA_DIR:-/etc/secureedge/ca}"
        target: /etc/secureedge/ca
        read_only: true
      - type: bind
        source: "${EDGEPROXY_STATE_DIR:-/var/lib/edgeproxy}"
        target: /edgeproxy-config
        read_only: true
    working_dir: /app/config
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: "${SECURITYEDGE_CPUS:-1.00}"
    mem_limit: "${SECURITYEDGE_MEMORY_LIMIT:-768m}"
    pids_limit: "${SECURITYEDGE_PIDS_LIMIT:-384}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${SECURITYEDGE_ADMIN_PORT:-9191}/readyz || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      com.secureedge.deployment: production
      com.secureedge.role: securityedge

secrets:
  securityedge_admin_token:
    file: "${SECURITYEDGE_ADMIN_TOKEN_FILE:-./secrets/securityedge_admin_token}"
  edgeproxy_admin_token:
    file: "${EDGEPROXY_ADMIN_TOKEN_FILE:-./secrets/edgeproxy_admin_token}"
