services:
  origin:
    build:
      context: ../../apps/edgeproxy
      target: origin-demo
    expose:
      - "9000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  edgeproxy:
    build:
      context: ../../apps/edgeproxy
      target: edgeproxy
    depends_on:
      origin:
        condition: service_healthy
    environment:
      EDGEPROXY_ADMIN_TOKEN: "${EDGEPROXY_ADMIN_TOKEN:?set EDGEPROXY_ADMIN_TOKEN in deployments/docker/.env}"
    expose:
      - "8080"
      - "9090"
    volumes:
      - edgeproxy-config:/app/config
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  securityedge:
    build:
      context: ../..
      dockerfile: apps/securityedge/Dockerfile
      args:
        VERSION: "development"
        COMMIT: "${SECURITYEDGE_COMMIT:-container}"
        BUILD_TIME: "${SECURITYEDGE_BUILD_TIME:-unknown}"
    depends_on:
      edgeproxy:
        condition: service_healthy
    environment:
      SECURITYEDGE_ADMIN_TOKEN: "${SECURITYEDGE_ADMIN_TOKEN:?set SECURITYEDGE_ADMIN_TOKEN in deployments/docker/.env}"
      EDGEPROXY_ADMIN_TOKEN: "${EDGEPROXY_ADMIN_TOKEN:?set EDGEPROXY_ADMIN_TOKEN in deployments/docker/.env}"
      SECURITYEDGE_EDGEPROXY_CONFIG_PATH: "/edgeproxy-config/config.json"
    ports:
      - "${SECURITYEDGE_HTTP_PORT:-8081}:8081"
      - "127.0.0.1:${SECURITYEDGE_ADMIN_PORT:-9191}:9191"
    volumes:
      - securityedge-config:/app/config
      - securityedge-logs:/app/logs
      - edgeproxy-config:/edgeproxy-config:ro
      - ../../integration:/integration:ro
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      backend:
        ipv4_address: 172.30.0.10

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  edgeproxy-config:
  securityedge-config:
  securityedge-logs:
