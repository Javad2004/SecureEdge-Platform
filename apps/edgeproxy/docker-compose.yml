services:
  origin:
    build:
      context: .
      target: origin-demo
    expose:
      - "9000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  proxy:
    build:
      context: .
      target: edgeproxy
    depends_on:
      origin:
        condition: service_healthy
    environment:
      EDGEPROXY_ADMIN_TOKEN: "${EDGEPROXY_ADMIN_TOKEN:?set EDGEPROXY_ADMIN_TOKEN in apps/edgeproxy/.env}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
